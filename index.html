<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamzy AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{padding:15px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:80%;padding:12px 16px;border-radius:18px}
.user{background:#fff;color:#000;align-self:flex-end}
.ai{background:#222;align-self:flex-start}
.inputBox{display:flex;gap:10px;padding:15px;border-top:1px solid #222}
.inputBox input{flex:1;padding:14px;border-radius:25px;border:none;background:#222;color:#fff;outline:none}
.inputBox button{padding:12px 20px;border-radius:25px;border:none;background:#fff;color:#000;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h3>Lamzy AI - Created by Azeez</h3></div>
<div class="chat" id="chat"></div>
<div class="inputBox">
<input id="msg" placeholder="Ask anything..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<script>
async function send(){
 const input=document.getElementById('msg');
 const text=input.value.trim(); if(!text)return;
 const chat=document.getElementById('chat');
 chat.innerHTML+=`<div class="bubble user">${text}</div>`;
 input.value='';
 const ai=document.createElement('div'); ai.className='bubble ai'; ai.textContent='Typing...'; chat.appendChild(ai);
 chat.scrollTop=chat.scrollHeight;
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
  const d=await r.json();
  ai.textContent=d.reply||d.message||'No reply';
 }catch{ ai.textContent='Error - Check OPENAI_API_KEY in Vercel Settings';}
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
